<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="../css/default.css">
        <style>
            #box {
                display: flex;
                width: 100%;
                height: 100%;
                gap: 40px;
            }
            #content {
                width: 920px;
                min-width: 920px;
                max-width: 920px;
            }

            .aba-header {
                display: flex;
                justify-content: space-between;
                padding: 20px 0px 20px 0px;
                align-items: center;
            }
            .title {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            .aba-name {
                font-size: 32px;
                font-weight: bold;
            }
            .aba-subname {
                font-size: 12px;
            }
            .buton-group {
                display: flex;
                gap: 10px;
            }
            .buton-group input{
                padding: 12px 10px;
                border-radius: 7px;
                border: none;
            }
            #btn-add-cliente {
                width: 100px;
                background-color: #12181f;
                color: #f5f1E7;
                transition: background-color 0.1s ease;
                cursor: pointer;
            }
            #btn-add-cliente:hover {
                background-color: #232d3b;
            }
            .search_box {
                display: flex;
                border-radius: 7px;
            }
            .search_box #search-client {
                width: 200px;
                border-left: none;
                border-radius: 0px 7px 7px 0px;
            }
            .search_box #search-client:focus {
                outline: none;
            }

            .search_box svg {
                background-color: white;
                height: 100%;
                border-radius: 7px 0px 0px 7px;
                padding-left: 10px;

            }

        </style>
    </head>
    <body>
        <div id="box">
            <app-sidebar></app-sidebar>
            <div id="content">
                <div class="cliente">
                    <div class="aba-header">
                        <div class="title">
                            <span class="aba-name">Clientes</span>
                            <span class="aba-subname">Registro de clientes</span>
                        </div>
                        <div class="buton-group">
                            <div class="search_box">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <input type="text" name="" id="search-client" placeholder="Buscar cliente...">
                            </div>
                            <input type="button" id="btn-add-cliente" value="Novo cliente" onclick="swap_modal('modal-clientes')"></input>
                        </div>
                    </div>
                    <client-table id="porraeessa"></client-table>
                </div>
            </div>
        </div>

        <style>
            input {
                outline: none;
                border: none;

            }
            input[type='button'] {
                cursor: pointer;
            }
            .modal-container.active {
                display: flex;
            }
            .modal-container {
                display: none;
                position: absolute;
                top: 0px;
                width: 100%;
                height: 100%;
                align-items: center;
                justify-content: center;
                background-color: #00000036;
            }
            .modal {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 480px;
                background-color: #FFFDF8;
                height: 550px;
                border-radius: 15px;
            }

            .modal form {
                display: flex;
                flex-direction: column;
                width: 90%;
                height: 90%;
                gap: 15px;
            }
            .modal .modal-title {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .modal-title .title {
                font-size: 24px;
            }
            .modal-title .instructions {
                font-size: 14px;
            }
            .modal .field {
                display: flex;
                width: 100%;
                flex-direction: column;
                gap: 5px;
                margin-bottom: 5px;
            } 
            .modal .field label,.modal form select {
                color: #726a5b;
            } 
            .modal .field-row {
                display: flex;
                justify-content: space-between;
                gap: 10px;
            }
            .modal form input,  .modal form select{
                padding: 12px 10px;
                flex-grow: 1;
                border-radius: 10px;
            }
            .modal form input[type="text"],.modal form input[type="email"], .modal form select  {
                border: 1px solid #dad2c0;
            }
            .modal form select {
                padding-right: 10px;
                appearance: none;
                cursor: pointer;
            }
            .modal form input:focus, .modal form select {
                outline: none;
            }
            .modal .footer{
                width: 60%;
                align-self: flex-end;
            }

            input.save {
                background-color: black;
                color: white;
            }
            input.cancel {
                background-color: white;
                border: 1px solid #dad2c0;
                width: 80%;
                align-self: flex-end;
            }
            

        </style>

        <div class="modal-container" id="modal-clientes">
            <div class="modal">
                <form action="" id="register-client-form">
                    <div class="modal-title">
                        <span class="title">Clientes</span>
                        <span class="instructions">Preencha os dados do novo cliente.</span>
                    </div>
                    <div class="field-row">
                        <div class="field"><label for="">* Nome</label><input type="text" placeholder="Nome" id="cliente-nome"></div>
                        <div class="field"><label for="">* CPF / CPNJ</label><input id="cliente-cpf" type="text" placeholder="000.000.000-00"></div>
                    </div>
                    <div class="field-row">
                        <div class="field"><label for="">* Telefone</label><input type="text" placeholder="(00) 0000-0000" id="cliente-numero"></div>
                        <div class="field"><label for="">Status</label><select type="text" placeholder="Name" id="cliente-status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
                    </div>
                    <div class="field"><label for="">Email</label><input type="email" placeholder="" id="cliente-email"></div>
                    <div class="field"><label for="">Endereço</label><input type="text" placeholder="Rua, Nº, Bairro, Cidade" id="cliente-endereco"></div>
                    <div class="field-row footer">
                        <div class="field"><input type="button" value="Cancelar" class="cancel" onclick="swap_modal('modal-clientes')"></div>
                        <div class="field"><input type="button" value="Salvar cliente" class="save" onclick="if(add_cliente()){swap_modal('modal-clientes')};"></div>
                    </div>
                </form>
            </div> 
        </div>
    </body>
    <script src="../js/sidebar.js"></script>
    <script src="../js/client-table.js"></script>
    <script src="../js/swap_class.js"></script>
    <script src="../js/form-extraction.js"></script>
    <script src="../js/clienteAPI.js"></script>

</html>
